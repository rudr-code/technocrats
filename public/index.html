            retroGreen: '#4ade80',
            retroDarkGreen: '#166534',
            retroDark: '#121212',

          boxShadow: {
            'pixel': '4px 4px 0px 0px #1e1e1e',
            'pixel-lg': '6px 6px 0px 0px #1e1e1e',

  <style>
    /* Pixel rendering optimizations */
    * {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    body {
      background-color: #F6F3E7;
      cursor: default;
    }

    /* Pixelated Search Bar Inner Shadow */
    .retro-search {
      border: 3px solid #1e1e1e;
      box-shadow: inset 2px 2px 0px #a3a3a3, 3px 3px 0px #1e1e1e;
    }

    /* Tactile Pixel Buttons */
    .pixel-btn {
      border: 3px solid #1e1e1e;
      box-shadow: 4px 4px 0px #1e1e1e;
      transition: all 0.08s ease-in-out;
    }
    .pixel-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px #1e1e1e;
    }
    .pixel-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #1e1e1e;
    }

    /* Custom Pixel Loading Animation */
    @keyframes loadStep {
      0% { width: 0%; }
      30% { width: 40%; }
      70% { width: 75%; }
      100% { width: 100%; }
    }
    .loading-fill {
      animation: loadStep 2s steps(8) infinite;
    }
  </style>
</head>
